  #     - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-samudra_user}:${POSTGRES_PASSWORD:-samudra_password_placeholder}@db:5432/${POSTGRES_DB:-samudra_db}
  #     - DATA_MODE=${DATA_MODE:-HYBRID}
  #     - LLM_PROVIDER=${LLM_PROVIDER:-openai}
  #     - LLM_API_KEY=${LLM_API_KEY}
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
